server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Serve shell scripts as text
    location ~* \.sh$ {
        default_type text/plain;
        # add_header here stops the server-level headers being inherited
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Disposition "attachment";
    }

    # Serve YAML files as text
    location ~* \.(yml|yaml)$ {
        default_type text/plain;
    }

    # API: list available playbooks
    location /api/playbooks {
        default_type application/json;
        alias /usr/share/nginx/html/playbooks-index.json;
    }

    # API: health check
    location /api/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"bootstrap-server"}';
    }

    # API: build info
    location /api/build-info {
        default_type application/json;
        alias /usr/share/nginx/html-config/build-info.json;
    }

    location = /build-info.json {
        default_type application/json;
        alias /usr/share/nginx/html-config/build-info.json;
    }

    # Runtime config (written by entrypoint to writable volume)
    location = /server-config.json {
        default_type application/json;
        alias /usr/share/nginx/html-config/server-config.json;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny .git internals if accidentally present
    location ~ /\.git {
        deny all;
        return 404;
    }

    # Enable directory listing for roles/playbooks browsing
    location /roles/ {
        autoindex on;
        autoindex_format html;
    }

    location /playbooks/ {
        autoindex on;
        autoindex_format html;
    }
}
