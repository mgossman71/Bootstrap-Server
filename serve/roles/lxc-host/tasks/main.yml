---
# roles/lxc-host/tasks/main.yml
# Tags: lxc-host
# Bridge (lxcbr0, 10.0.3.1/24) plus DHCP/DNS come from the lxc-net service
# shipped with the lxc package; it runs its own dnsmasq on lxcbr0.

- name: Check if systemd is running
  ansible.builtin.stat:
    path: /run/systemd/system
  register: systemd_running
  tags: [lxc-host]

- name: Install LXC packages
  ansible.builtin.apt:
    name:
      - lxc
      - lxc-utils
      - libvirt-clients
      - bridge-utils
    state: present
  tags: [lxc-host]

- name: Configure LXC default network bridge
  ansible.builtin.copy:
    dest: /etc/lxc/default.conf
    content: |
      lxc.net.0.type = veth
      lxc.net.0.link = lxcbr0
      lxc.net.0.flags = up
      lxc.net.0.hwaddr = 00:16:3e:xx:xx:xx
    mode: '0644'
  tags: [lxc-host]

- name: Configure lxc-net bridge
  ansible.builtin.copy:
    dest: /etc/default/lxc-net
    content: |
      USE_LXC_BRIDGE="true"
      LXC_BRIDGE="lxcbr0"
      LXC_ADDR="10.0.3.1"
      LXC_NETMASK="255.255.255.0"
      LXC_NETWORK="10.0.3.0/24"
      LXC_DHCP_RANGE="10.0.3.2,10.0.3.254"
      LXC_DHCP_MAX="253"
    mode: '0644'
  notify: Restart lxc-net
  tags: [lxc-host]

- name: Enable lxc-net (systemd)
  ansible.builtin.systemd:
    name: lxc-net
    enabled: yes
    state: started
  when: systemd_running.stat.exists
  tags: [lxc-host]

- name: Enable cgroup memory accounting
  ansible.builtin.copy:
    dest: /etc/default/grub.d/99-lxc-cgroups.cfg
    content: |
      GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} cgroup_enable=memory swapaccount=1 systemd.unified_cgroup_hierarchy=1"
    mode: '0644'
  notify: Update grub
  tags: [lxc-host]

- name: Set default LXC download template cache
  ansible.builtin.file:
    path: /var/cache/lxc/download
    state: directory
    mode: '0755'
  tags: [lxc-host]
