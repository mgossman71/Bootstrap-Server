name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Record build time
        id: time
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ steps.time.outputs.now }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate image
        run: |
          docker build -t bootstrap-server:ci \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg GIT_BRANCH=${{ github.ref_name }} \
            --build-arg BUILD_TIME=${{ steps.time.outputs.now }} \
            .
          # Quick smoke test: serve and curl the index
          docker run -d --rm --name smoke -p 8888:80 bootstrap-server:ci
          trap 'docker stop smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            curl -sf http://localhost:8888/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8888/ | grep -q "Bootstrap Server"
          curl -sf http://localhost:8888/api/health | grep -q "ok"
          curl -sf http://localhost:8888/bootstrap.sh | grep -q "set -euo pipefail"
